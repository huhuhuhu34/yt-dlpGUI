[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdlpgui"
version = "1.0.0"
description = "yt-dlpGUI 跨平台版：yt-dlp 图形界面（Python/tkinter，重点 Windows）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools]
packages = ["ytdlp_gui", "ytdlp_gui.ui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
